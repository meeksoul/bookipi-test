x-api-env: &api-env
  REDIS_URL: redis://redis:6379
  DATABASE_URL: postgres://flash:flash@postgres:5432/flashsale
  ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
  SALE_ID: ${SALE_ID:-launch}
  SALE_STARTS_AT: ${SALE_STARTS_AT:-}
  SALE_ENDS_AT: ${SALE_ENDS_AT:-}
  SALE_STOCK: ${SALE_STOCK:-100}
  LOG_LEVEL: warn

services:
  redis:
    image: redis:7-alpine
    # AOF with fsync every second: at most ~1s of acknowledged writes can be lost
    # on a hard crash, in exchange for keeping the purchase path in memory.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
      POSTGRES_DB: flashsale
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash -d flashsale"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: { context: ., dockerfile: server/Dockerfile }
    environment: *api-env
    deploy:
      replicas: 3
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 2s
      retries: 5

  worker:
    build: { context: ., dockerfile: server/Dockerfile }
    command: ["node", "dist/worker.js"]
    environment: *api-env
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    ports: ["8080:80"]
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }

volumes:
  redis-data:
  pg-data:
