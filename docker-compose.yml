x-api-env: &api-env
  REDIS_URL: redis://redis:6379
  MONGO_URL: mongodb://mongo:27017/flashsale?replicaSet=rs0
  ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
  SALE_ID: ${SALE_ID:-launch}
  SALE_STARTS_AT: ${SALE_STARTS_AT:-}
  SALE_ENDS_AT: ${SALE_ENDS_AT:-}
  SALE_STOCK: ${SALE_STOCK:-100}
  LOG_LEVEL: warn

services:
  redis:
    image: redis:7-alpine
    # AOF with fsync every second: at most ~1s of acknowledged writes can be lost
    # on a hard crash, in exchange for keeping the purchase path in memory.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  mongo:
    image: mongo:8
    # A replica set (even of one node) is required for majority write concern,
    # retryable writes and transactions. Production would run 3 data-bearing members.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      # Initialises the replica set on first start, then reports whether this node is primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: { context: ., dockerfile: server/Dockerfile }
    environment: *api-env
    deploy:
      replicas: 3
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 2s
      retries: 5

  worker:
    build: { context: ., dockerfile: server/Dockerfile }
    command: ["node", "dist/worker.js"]
    environment: *api-env
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    ports: ["8080:80"]
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }

volumes:
  redis-data:
  mongo-data:
