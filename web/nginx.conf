worker_processes auto;

events {
  worker_connections 16384;
}

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  access_log    off;

  # Docker's DNS returns one address per API replica; nginx round-robins across them.
  upstream api {
    server api:3000 max_fails=3 fail_timeout=5s;
    keepalive 256;
  }

  server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
      # Only retry requests that never reached a replica, so a purchase is not
      # sent twice; purchases are idempotent per user anyway.
      proxy_next_upstream error;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
